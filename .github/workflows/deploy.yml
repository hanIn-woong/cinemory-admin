# 관리자 웹 배포 (admin-spec 6-7). main push = 배포(백엔드 deploy.yml과 같은 방식: OIDC + S3 + SSM).
# 흐름: 설치·빌드 → S3 업로드(admin-releases/<sha>/) → SSM으로 서버의 admin-deploy.sh 실행(압축 해제·링크 교체·응답 확인·자동 복구) → 외부 확인
#
# ⚠️ job에 environment:를 붙이지 않는다 — OIDC 토큰의 sub가 "...:environment:이름"으로 바뀌어
#    배포 역할의 신뢰 정책(repo:hanIn-woong/cinemory-admin:ref:refs/heads/main)과 어긋난다.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:      # 재배포용. 신뢰 정책상 main에서만 성공한다

concurrency:
  group: deploy-admin
  cancel-in-progress: false

permissions:
  id-token: write         # OIDC 토큰 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  SITE_URL: https://admin.cinemory.co.kr/

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run lint
          npm run build           # tsc -b + vite build → dist/
          test -f dist/index.html
          tar -czf dist.tar.gz -C dist .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts
        run: |
          PREFIX="s3://${{ vars.ARTIFACT_BUCKET }}/admin-releases/${GITHUB_SHA}"
          aws s3 cp --only-show-errors dist.tar.gz "$PREFIX/dist.tar.gz"
          aws s3 cp --only-show-errors deploy/admin-deploy.sh "$PREFIX/admin-deploy.sh"
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          jq -n --arg p "$PREFIX" --arg sha "$GITHUB_SHA" '{commands: [
            "/snap/bin/aws s3 cp --only-show-errors \($p)/admin-deploy.sh /tmp/admin-deploy.sh && bash /tmp/admin-deploy.sh \($p)/dist.tar.gz \($sha)"
          ], executionTimeout: ["300"]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "admin deploy ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)   # 발송 직후엔 InvocationDoesNotExist
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[ResponseCode, StandardOutputContent, StandardErrorContent]' --output text || true

          echo "- 서버 스크립트: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != Success ]; then
            echo "::error::서버 배포 실패($STATUS). 종료 코드 2 = 이전 릴리스로 자동 복구됨"
            exit 1
          fi

      # 서버 안 확인이 통과해도 DNS·인증서·Nginx 경로가 깨졌을 수 있다
      - name: External check
        run: |
          for i in $(seq 1 6); do
            BODY=$(curl -fsS --max-time 10 "$SITE_URL" || true)
            case "$BODY" in *'id="root"'*) echo "OK"; echo "- 외부 확인: OK" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;; esac
            echo "시도 $i: ${BODY:-응답 없음}"; sleep 10
          done
          echo "::error::$SITE_URL 이 관리자 웹을 돌려주지 않습니다 — Nginx·인증서·DNS를 본다"
          exit 1
