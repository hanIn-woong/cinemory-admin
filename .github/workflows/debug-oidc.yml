# 임시 진단 — OIDC AssumeRole 실패 원인 확인용. 확인 후 삭제한다.
name: debug-oidc
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Show OIDC claims and role name
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref}'
          echo "role 이름: $(echo "$ROLE_ARN" | awk -F/ '{print $NF}')"
          echo "role ARN 길이: ${#ROLE_ARN}  / 접두: $(echo "$ROLE_ARN" | cut -c1-13)"
